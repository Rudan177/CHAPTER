<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7ff">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#10131b">
    <meta name="description" content="Material Design 3 Expressive 风格音乐播放器">
    <title>Audio Player</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%233e63c6'/%3E%3Cpath d='M9.5 16.2V8.1a1 1 0 0 1 .76-.97l4.2-1.05a1 1 0 0 1 1.24.97v7.45' fill='none' stroke='%23fff' stroke-width='1.7' stroke-linecap='round'/%3E%3Ccircle cx='8.2' cy='16.4' r='1.9' fill='%23fff'/%3E%3Ccircle cx='14.4' cy='14.7' r='1.9' fill='%23fff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="Style/player.css">
    <script src="Script/player.js" defer></script>
</head>
<body>
<main class="stage">
    <!-- 氛围背景：渐变 + 模糊封面 -->
    <div class="ambient" aria-hidden="true">
        <div class="ambient-base"></div>
        <div class="ambient-img" id="ambientImg"></div>
    </div>

    <!-- 播放器栈：播放器卡片与播放列表同宽堆叠 -->
    <div class="player-stack">

        <!-- 播放器卡片：网格两行 = 完整形态（.player-full）⇄ 长胶囊（.player-mini） -->
        <section class="player-card" id="playerCard" aria-label="音乐播放器">

            <!-- 完整形态 -->
            <div class="player-full" id="playerFull">
                <div class="full-inner">
                    <figure class="cover-area">
                        <div class="cover" id="cover">
                            <svg class="cover-fallback" viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".5"/>
                                <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".8"/>
                                <path d="M12 8.6a3.4 3.4 0 1 1-3.4 3.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".65"/>
                            </svg>
                            <img class="cover-img" id="coverImg" alt="专辑封面" draggable="false">
                            <img class="cover-img" id="coverImgAlt" alt="" draggable="false">
                        </div>
                    </figure>

                    <section class="panel">
                        <header class="meta">
                            <h1 class="title" id="songTitle"><span class="title-text" id="songTitleText">Name</span></h1>
                            <p class="artist" id="songArtist">Artist</p>
                        </header>

                        <div class="progress-zone">
                            <div class="slider" id="slider" role="slider" tabindex="0"
                                 aria-label="播放进度" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="0:00">
                                <div class="slider-track">
                                    <div class="slider-layer slider-buffered" id="sliderBuffered"></div>
                                    <div class="slider-layer slider-fill" id="sliderFill"></div>
                                    <div class="slider-thumb" id="sliderThumb"></div>
                                </div>
                            </div>
                            <div class="times">
                                <span id="timeCurrent">0:00</span>
                                <span id="timeDuration">--:--</span>
                            </div>
                        </div>

                        <div class="controls">
                            <button class="skip-btn ripple" id="btnPrev" type="button" aria-label="上一曲">
                                <svg class="skip-icon" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                                </svg>
                            </button>

                            <button class="fab ripple" id="btnPlay" type="button" aria-label="播放">
                                <span class="ripple-clip" aria-hidden="true"></span>
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path class="icon-play" d="M8.4 5.6v12.8a1.2 1.2 0 0 0 1.83 1.02l10.1-6.4a1.2 1.2 0 0 0 0-2.04L10.23 4.58A1.2 1.2 0 0 0 8.4 5.6Z"/>
                                    <g class="icon-pause">
                                        <rect x="6.6" y="5" width="4.1" height="14" rx="1.5"/>
                                        <rect x="13.3" y="5" width="4.1" height="14" rx="1.5"/>
                                    </g>
                                </svg>
                                <span class="fab-ring" aria-hidden="true"></span>
                            </button>

                            <button class="skip-btn ripple" id="btnNext" type="button" aria-label="下一曲">
                                <svg class="skip-icon" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                                </svg>
                            </button>
                        </div>
                    </section>
                </div>
            </div>

            <!-- 收起形态：长胶囊 -->
            <div class="player-mini" id="playerMini">
                <div class="mini-inner">
                    <button class="mini-open ripple" id="btnMiniOpen" type="button" aria-label="展开播放器">
                        <span class="ripple-clip" aria-hidden="true"></span>
                        <span class="mini-cover" id="miniCover" aria-hidden="true">
                            <img class="mini-cover-img" id="miniCoverImg" alt="" draggable="false">
                            <img class="mini-cover-img" id="miniCoverImgAlt" alt="" draggable="false">
                        </span>
                        <span class="mini-meta">
                            <span class="mini-title" id="miniTitle">Name</span>
                            <span class="mini-artist" id="miniArtist">Artist</span>
                        </span>
                    </button>
                    <button class="mini-btn ripple" id="btnMiniPrev" type="button" aria-label="上一曲">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button class="mini-btn ripple" id="btnMiniPlay" type="button" aria-label="播放">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path class="icon-play" d="M8.4 5.6v12.8a1.2 1.2 0 0 0 1.83 1.02l10.1-6.4a1.2 1.2 0 0 0 0-2.04L10.23 4.58A1.2 1.2 0 0 0 8.4 5.6Z"/>
                            <g class="icon-pause">
                                <rect x="6.6" y="5" width="4.1" height="14" rx="1.5"/>
                                <rect x="13.3" y="5" width="4.1" height="14" rx="1.5"/>
                            </g>
                        </svg>
                    </button>
                    <button class="mini-btn ripple" id="btnMiniNext" type="button" aria-label="下一曲">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                </div>
            </div>
        </section>

        <!-- 播放列表：收起时是与播放器同宽的长胶囊，展开后列出曲目 -->
        <section class="playlist-card" id="playlistCard" aria-label="播放列表">
            <button class="playlist-head ripple" id="btnPlaylist" type="button"
                    aria-expanded="false" aria-controls="playlistBody">
                <svg class="playlist-glyph" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 6h12v2H3zM3 11h12v2H3zM3 16h8v2H3zM17 9v8l5-4z"/>
                </svg>
                <span class="playlist-head-title">播放列表</span>
                <span class="playlist-count" id="playlistCount"></span>
                <svg class="playlist-chevron" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/>
                </svg>
            </button>
            <div class="playlist-body" id="playlistBody">
                <ol class="playlist-list" id="playlistList"></ol>
            </div>
        </section>
    </div>

    <div class="error-layer" id="errorLayer" hidden>
        <div class="error-card" role="alert">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <path d="M12 7.4v5.4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
                <circle cx="12" cy="16.2" r="1.15" fill="currentColor"/>
            </svg>
            <h2>Audio Loading Failed</h2>
            <p id="errorMsg">Check your network connection and try again.</p>
            <button class="retry-btn ripple" id="btnRetry" type="button">Retry</button>
        </div>
    </div>

    <!-- 曲目来源由 Script/player.js 注入（images/MusicLog/music.json） -->
    <audio id="audio" preload="metadata"></audio>
    <noscript><p class="noscript">需要启用 JavaScript 才能使用播放器。</p></noscript>
</main>
</body>
</html>
