    <script>
        // 首屏关键：在渲染前应用保存的主题和字体，防止闪白
        (function () {
            var html = document.documentElement;
            var savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                html.setAttribute('data-theme', savedTheme);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                html.setAttribute('data-theme', 'dark');
            } else {
                html.setAttribute('data-theme', 'light');
            }
            var savedFont = localStorage.getItem('font');
            if (savedFont) {
                html.setAttribute('data-font', savedFont);
            }
            // 极简模式：在 body 解析前激活隐藏样式
            var isMinimalist = localStorage.getItem('minimalist') === 'true';
            window.minimalistEnabled = isMinimalist;
            if (isMinimalist) {
                document.getElementById('minimalistHide').media = 'all';
            }
        })();
    </script>
